[pytest]
# rootdir resolves to backend/ (this file's directory). The codebase is
# unified on `backend.`-prefixed imports (Phase 0), so the *parent* of
# backend/ must be importable. Declaring it here means the suite works
# regardless of which directory pytest is invoked from -- and it is
# config, not a runtime sys.path mutation, so it does not reintroduce the
# import hack Phase 0 removed from engine/*.py.
pythonpath = ..

testpaths = tests

markers =
    gate(id): the phase acceptance gate this test provides evidence for
    slow: regenerates the full 8000-case training corpus or similar; opt in with -m slow
    requires_network: needs live Gemini egress; skipped by default

# Fail on unraisable/unhandled warnings we care about is deliberately NOT
# set globally -- specific tests assert on specific warnings instead, so a
# noisy third-party DeprecationWarning can never masquerade as a gate failure.
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

addopts = -ra --strict-markers
